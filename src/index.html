<!doctype html>
<!-- RAMeow 内存喵 — by Miaomiao (github.com/Miaomiaomeowmeow) · CC BY-NC-SA 4.0 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAMeow</title>
<style>@font-face{font-family:"Saira";src:url("fonts/saira.woff2") format("woff2");font-weight:100 900;font-stretch:50% 125%;font-display:swap}</style>
<style>
:root{--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.32,1.3,.42,1);--wide:"Saira","Noto Sans SC",sans-serif;--txt:"Noto Sans SC","Microsoft YaHei UI",sans-serif}
body[data-m="g"]{--page:#1C201F;--b1:#3A403E;--b2:#272C2A;--scr:#111513;--dot:rgba(255,255,255,.055);--ink:#E9EFEB;--sub:#8F9994;--dim:#5B6460;--off:rgba(255,255,255,.07);--c1:#F3F6F4;--c2:#CDD3D0;--c3:#A9B1AD;--c4:#8A938F;--c5:#6F7874;--oth:rgba(255,255,255,.2);--sys:rgba(255,255,255,.34);--acc:#FF8A2A;--ok:#46E3B0;--k1:#4A504E;--k2:#323735;--kwall:#191D1C;--klip:rgba(0,0,0,.35);--khi:rgba(255,255,255,.13);--shadow:0 30px 70px rgba(0,0,0,.55),0 8px 18px rgba(0,0,0,.35);--hov:rgba(255,255,255,.045)}
body[data-m="w"]{--page:#E7E7E4;--b1:#FAFAF9;--b2:#ECECEA;--scr:#DFE0DE;--dot:rgba(0,0,0,.03);--ink:#1C1E1D;--sub:#6C706E;--dim:#A2A5A3;--off:rgba(0,0,0,.08);--c1:#1E2120;--c2:#3C413F;--c3:#5C625F;--c4:#7E8481;--c5:#9DA29F;--oth:rgba(0,0,0,.2);--sys:rgba(0,0,0,.34);--acc:#E5542A;--ok:#1E2120;--k1:#FFFFFF;--k2:#EFEFED;--kwall:#C9C9C5;--klip:rgba(0,0,0,.08);--khi:#fff;--shadow:0 30px 60px rgba(40,40,35,.16),0 8px 16px rgba(40,40,35,.08);--hov:rgba(0,0,0,.035)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:radial-gradient(70% 60% at 50% 15%,color-mix(in srgb,var(--page) 86%,#fff 14%),var(--page));color:var(--ink);font:13px/1.45 var(--txt);user-select:none}
::view-transition-old(root),::view-transition-new(root){animation-duration:.38s}
.w{font-family:var(--wide);font-stretch:118%;font-variant-numeric:tabular-nums}
.tag{font-family:var(--wide);font-stretch:125%;font-weight:600;font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim)}
.scr{position:relative;background:var(--scr);border-radius:12px;box-shadow:inset 0 2px 6px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.03),0 1px 0 rgba(255,255,255,.06)}
body[data-m="w"] .scr{box-shadow:inset 0 2px 5px rgba(0,0,0,.13),inset 0 0 0 1px rgba(0,0,0,.04),0 1px 0 #fff}
.scr::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(var(--dot) .7px,transparent .9px) 0 0/4px 4px;pointer-events:none}
.scr>*{position:relative}
/* 厚按键：顶面高光 + 下唇 + 侧壁厚度 + 落地阴影；按下整块下沉 */
.key{position:relative;border:0;cursor:pointer;font:500 12px var(--txt);color:var(--ink);background:linear-gradient(180deg,var(--k1),var(--k2));border-radius:10px;box-shadow:inset 0 1px 0 var(--khi),inset 0 -2px 0 var(--klip),0 3px 0 var(--kwall),0 6px 10px rgba(0,0,0,.35);transform:translateY(0);transition:transform .09s,box-shadow .09s,color .2s}
body[data-m="w"] .key{box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 var(--klip),0 3px 0 var(--kwall),0 6px 12px rgba(0,0,0,.10)}
.key:active,.key.down,.key.latched{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--khi),inset 0 -1px 0 var(--klip),0 1px 0 var(--kwall),0 2px 4px rgba(0,0,0,.22)}
.key.latched{color:var(--acc)}
#dev{position:fixed;top:16px;left:50%;width:208px;height:64px;transform:translateX(-50%);border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--b1),var(--b2));box-shadow:inset 0 1px 0 var(--khi),inset 0 -1px 0 rgba(0,0,0,.4),var(--shadow);cursor:pointer}
#dev.open{cursor:default}
#mini{position:absolute;left:6px;right:6px;top:6px}
#mini .scr{height:32px;display:flex;align-items:center;gap:9px;padding:0 12px;overflow:hidden;white-space:nowrap}
#mPct{font-size:21px;font-weight:300;line-height:1}
#mInfo{font-size:12px;color:var(--sub);opacity:0;transition:opacity .15s;overflow:hidden;text-overflow:ellipsis}
#mInfo b{color:var(--ink);font-weight:500}
#dev.long #mInfo{opacity:1;transition:opacity .25s .08s}
.led{width:7px;height:7px;border-radius:50%;background:var(--st,var(--acc));box-shadow:0 0 7px var(--st,var(--acc));flex:none}
body.blink .led{opacity:.3}
#panel{position:absolute;left:0;top:0;width:360px;padding:12px 12px 10px;opacity:0;pointer-events:none}
#dev.open #panel{pointer-events:auto}
.hd{display:flex;align-items:center;justify-content:space-between;padding:0 2px 10px 8px;cursor:pointer}
.hd .t{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--sub)}
.hd .t b{color:var(--ink);font-weight:500}
.hb{display:flex;gap:8px}
.x{width:30px;height:28px;display:grid;place-items:center}
.x svg{width:13px;height:13px}
#gear svg{transition:transform .6s var(--spring)}
#gear.latched svg{transform:rotate(90deg)}
/* 设置：从标题下面往下滑出 */
#set{display:grid;grid-template-rows:0fr;transition:grid-template-rows .42s var(--ease)}
#set.on{grid-template-rows:1fr}
.setIn{overflow:hidden;min-height:0}
.setIn>*{opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .35s var(--spring)}
.setIn>:last-child{margin-bottom:10px}
#set.on .setIn>*{opacity:1;transform:none}
#set.on .setIn>:nth-child(2){transition-delay:.05s}
#set.on .setIn>:nth-child(n+3){transition-delay:.1s}
.sr{display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 4px 0 8px;border-radius:10px}
.sr.flash{animation:flash 1.2s var(--ease)}
@keyframes flash{0%,60%{background:color-mix(in srgb,var(--acc) 14%,transparent)}}
.seg{display:flex;gap:7px}
.seg .key{padding:6px 12px 6px 10px;min-width:62px;text-align:left}
.seg .key::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--off);transition:background .2s,box-shadow .2s}
.seg .key.latched::before{background:var(--acc);box-shadow:0 0 6px var(--acc)}
.seg.sm .key{min-width:0;padding:5px 9px 5px 8px}
.aist{display:flex;gap:7px;margin:0 4px 4px 8px;font-size:11.5px;line-height:1.5;color:var(--sub)}
.aist:has(#aiTxt:empty){display:none}
.aist i{flex:none;width:6px;height:6px;margin-top:6px;border-radius:50%;background:var(--dim)}
.aist.on i{background:var(--ok);box-shadow:0 0 6px var(--ok)}
body[data-m="w"] .aist.on i{background:#2FA36B;box-shadow:0 0 6px #2FA36B}
/* 自己的 API：一套就够，没有多套预设 */
#apiF{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
#apiF.on{grid-template-rows:1fr}
#apiF>div{overflow:hidden;min-height:0}
.fr{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 4px 4px 8px;font-size:11.5px;color:var(--sub)}
.fr>.fld:last-child{grid-column:2/-1}
.fld{width:100%;min-width:0;height:28px;border:0;border-radius:8px;padding:0 9px;background:var(--scr);color:var(--ink);font:12px var(--txt);box-shadow:inset 0 2px 4px rgba(0,0,0,.16);outline:none;user-select:text;appearance:none}
.fld:focus{box-shadow:inset 0 2px 4px rgba(0,0,0,.16),0 0 0 1.5px var(--acc)}
.key.sm{padding:5px 10px;font-size:11.5px}
#tRow{display:none}
#tRow.on{display:grid}
#fMsg{grid-column:1/3;color:var(--sub)}
#fMsg.ok{color:#2FA36B}
#fMsg.bad{color:var(--acc)}
.main{padding:14px 16px}
.big b{font-size:44px;font-weight:200;line-height:1;letter-spacing:.5px}
.big span{font-size:12px;color:var(--sub);margin-left:6px}
#bar{display:grid;grid-template-columns:repeat(32,1fr);gap:3px;height:22px;margin-top:14px;position:relative;cursor:pointer}
#bar .c{border-radius:1.5px;background:var(--off);transition:background .35s var(--ease),opacity .25s,transform .2s}
#bar.focus .c:not(.hl){opacity:.18}
#bar .c.hl{transform:scaleY(1.12)}
#bar .c.drain{background:var(--off)!important;transition:background .12s}
body[data-m="g"] #bar .c.lit{box-shadow:0 0 5px rgba(255,255,255,.12)}
#tipBox{position:absolute;bottom:30px;left:0;padding:4px 8px;border-radius:7px;background:var(--ink);color:var(--scr);font-size:11.5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:3}
#tipBox.on{opacity:1}
.scale{display:flex;justify-content:space-between;margin-top:6px}
.info{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--sub)}
.info b{color:var(--ink);font-weight:500}
.q{display:inline-grid;place-items:center;width:18px;height:17px;margin-left:6px;font:600 10px var(--txt);border-radius:6px;cursor:help;position:relative}
.q .pop{position:absolute;right:-8px;top:26px;width:260px;padding:12px 14px;border-radius:12px;background:var(--scr);color:var(--ink);box-shadow:0 14px 30px rgba(0,0,0,.4);font:12px/1.65 var(--txt);text-align:left;opacity:0;transform:translateY(-4px);pointer-events:none;transition:.2s;z-index:6}
.q .pop{display:none}
#qFloat{position:fixed;z-index:50;width:260px;padding:12px 14px;border-radius:12px;background:var(--scr);color:var(--ink);box-shadow:0 14px 30px rgba(0,0,0,.28);font:12px/1.65 var(--txt);opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .18s,transform .18s}
#qFloat.on{opacity:1;transform:none}
#qFloat b{color:var(--acc);font-weight:500}
.pop b{color:var(--acc);font-weight:500}
.pop.up{top:auto;bottom:28px;left:-10px;right:auto}
.pop .key{margin-top:8px;padding:5px 10px;pointer-events:auto}
/* AI 建议：平时一行滚动字幕（像 Winamp 滚歌名），点一下展开全文 + 去看 */
.tip{margin-top:10px;padding:7px 10px 7px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12px;line-height:1.5;cursor:pointer}
.tk{overflow:hidden;white-space:nowrap}
.tip.scroll .tk{-webkit-mask:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 18px),transparent);mask:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 18px),transparent)}
#tipTxt{display:inline-block}
#tipTxt>span{display:inline-block;padding-right:40px}
.tip:not(.scroll) #tipTxt>.dup,.tip.open #tipTxt>.dup{display:none}
.tip.scroll:not(.open) #tipTxt{animation:tick var(--dur,12s) linear infinite}
.tip:hover #tipTxt{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}
.tip.open .tk{white-space:normal;padding:4px 0}
.tip.open #tipTxt>span{display:inline;padding-right:0}
.ta{display:flex;gap:8px;align-items:center}
.tip:not(.open) #tipGo{display:none}
#askB{min-width:68px;padding:5px 10px;text-align:center}
.tip>.ai,.tip>.ta{align-self:start} /* 「问 AI」和「返回」钉在右上角，问完不挪位置，鼠标不用动 */
.tip>.ai{min-height:27px}
#askB{color:var(--acc)}
#askB[hidden]{display:none}
.tip.asking #tipTxt{color:var(--sub)}
#plan{grid-column:1/-1;display:none}
#plan.on{display:block}
.pi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 2px;border-top:1px solid var(--off);font-size:12.5px;cursor:pointer}
.pi .bx{width:15px;height:15px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--dim);display:grid;place-items:center;font-size:10px;color:transparent;transition:background .15s}
.pi.on .bx{background:var(--acc);box-shadow:none;color:#fff}
.pi.nokill{cursor:default}
.pi.nokill .bx{opacity:.3}
.pi .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi small{color:var(--sub);margin-left:6px;font-size:11.5px}
.pf{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px;border-top:1px solid var(--off)}
.pd{margin:8px 2px 2px;color:var(--sub);font-size:12px;line-height:1.65;white-space:pre-wrap;user-select:text}
.tip:not(.open) #plan{display:none}
.raw{color:var(--sub);font-size:11.5px;cursor:pointer;white-space:nowrap}
.rawT{display:none;color:var(--sub);font-size:11.5px;line-height:1.55;padding:8px 2px 0;white-space:pre-wrap;word-break:break-all;max-height:120px;overflow:auto;user-select:text}
#plan.raw-on .rawT{display:block}
.tip .ai{display:flex;align-items:center;gap:7px;white-space:nowrap;font-family:var(--wide);font-stretch:125%;font-weight:600;font-size:9.5px;letter-spacing:1.4px;color:var(--ok)}
body[data-m="w"] .tip .ai{color:var(--acc)}
#tipTxt{transition:opacity .2s,transform .3s var(--ease)}
#tipTxt.think{color:var(--sub)}
.tip .key{padding:5px 11px}
.tip .q{width:18px;height:18px;margin:0;padding:0;border-radius:6px;font:600 10px/1 var(--txt);letter-spacing:0;color:var(--ink)}
/* 详细列表：高度跟着往下拉的距离走，拉到哪一行，哪一行才长出来 */
#detail{position:relative;overflow:hidden;height:0}
#detail.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--dim) transparent}
.lh{display:none} /* 不写「谁在占 · LIVE」：多余的字 */
#list{margin-top:10px}
.row{border-radius:12px;overflow:hidden;opacity:0;transform:translateY(-8px) scale(.98);transition:opacity .25s,transform .35s var(--spring),background .2s}
.row.in{opacity:1;transform:none}
.row.gone{opacity:0!important;transform:translateX(14px)!important}
.row:hover,.row.open{background:var(--hov)}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 8px 10px;cursor:pointer;font-size:13px}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.nm small{color:var(--sub);font-weight:400;font-size:12px;margin-left:5px}
.nm em{font-style:normal;font-size:12px;color:var(--acc);margin-left:8px;font-weight:400}
.v{font-size:15px}
.v small{font:400 11px var(--txt);color:var(--sub);margin-left:3px}
.ticks{grid-column:1/-1;display:grid;grid-template-columns:repeat(32,1fr);gap:3px;height:3px}
.ticks i{border-radius:1px;background:transparent;transition:background .35s}
.row:hover .ticks i:not(.on){background:var(--off)}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--spring)}
.row.open .more{grid-template-rows:1fr}
.more>div{overflow:hidden}
.dt{padding:0 8px 12px;color:var(--sub);font-size:12px}
.dt p{margin:2px 0 10px}
.acts{display:flex;gap:10px}
.acts .key{padding:7px 13px}
.hold{overflow:hidden;color:var(--acc)!important}
.hold::before{content:'';position:absolute;inset:0;border-radius:inherit;background:color-mix(in srgb,var(--acc) 22%,transparent);clip-path:inset(0 calc(100% - var(--p,0)*100%) 0 0);pointer-events:none}
.hold i{position:absolute;left:8px;right:8px;bottom:4px;height:2px;border-radius:1px;background:var(--acc);box-shadow:0 0 8px var(--acc);transform:scaleX(var(--p,0));transform-origin:left}
.parts{margin:-4px 0 10px}
.cat{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 6px;border-radius:8px;font-size:12.5px;color:var(--ink)}
.cat .n{color:var(--sub);font-size:11.5px}
.cat .look{color:var(--dim);font-size:11px;min-width:30px;text-align:right}
.cat.go{background:color-mix(in srgb,var(--acc) 9%,transparent);cursor:pointer}
.cat.go .look{color:var(--acc);font-size:14px}
.cat.vo{cursor:pointer}
.cat.vo:hover{background:var(--hov)}
.hint{margin:0 6px 6px;color:var(--sub)}
.sub{margin:4px 0 6px 10px;padding-left:10px;border-left:2px solid color-mix(in srgb,var(--acc) 40%,transparent)}
.warn{color:var(--acc);font-size:11.5px;margin:2px 0 6px}
.cc{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:5px 0;font-size:12px;border-top:1px solid var(--off)}
.cc .t{color:var(--ink)}
.cc .s{display:block;color:var(--sub);font-size:11px}
.cc .s.live{color:var(--acc)}
.cc .key{padding:4px 9px;font-size:11px}
.mine{display:inline-block;margin-left:4px;padding:0 6px;border-radius:6px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);font-size:10.5px}
.morec{color:var(--sub);font-size:11.5px;padding:5px 0 0;cursor:pointer}
.parts .done{padding:6px 0;font-size:12px}
.done{padding:11px 8px;color:var(--ok);font-weight:500;display:flex;gap:8px;align-items:center}
/* 底边按钮：点一下看详细 / 收起详细；长按全部收起 */
.ft{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 8px 2px;font-size:11.5px;color:var(--sub)}
#ftT{visibility:hidden} /* 「每 3 秒更新 / 你在看，先停住」不写，位置留着让 ⌄ 居中 */
#moreB{width:54px;height:20px;padding:0;border-radius:9px;display:grid;place-items:center;overflow:hidden}
#moreB svg{width:12px;height:12px;transition:transform .45s var(--spring)}
#moreB.up svg{transform:rotate(180deg)}
#moreB:hover{color:var(--acc)}
#moreB i{position:absolute;left:7px;right:7px;bottom:3px;height:2px;border-radius:1px;background:var(--acc);box-shadow:0 0 6px var(--acc);transform:scaleX(var(--p,0));transform-origin:left}
#gHint{justify-self:end;white-space:nowrap}
body.alarm .led{background:#E5342A;box-shadow:0 0 8px #E5342A}
body.alarm #mPct{color:#E5342A;font-weight:400}
#mInfo .gw{color:#E5342A;font-weight:500}
.nm em.mb{color:var(--sub)}
.nm small.sb{display:block;margin:2px 0 0;font-size:11.5px}
.nm small.sb.live{color:var(--acc)}
.sr{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 8px;border-radius:9px;font-size:13px}
.sr .nm small{margin-left:8px}
.sr .nm em{margin-left:6px}
.sr.go{cursor:pointer}
.sr:hover,.cv:hover{background:var(--hov)}
.cv{border-radius:9px}
.cv .sr:hover{background:none}
.hvb{position:absolute!important;right:6px;top:0;bottom:0;margin:auto 0;height:max-content;visibility:hidden;padding:4px 10px!important;font-size:11.5px}
.sr:hover .hvb{visibility:visible}
.sr:hover:has(.hvb) .v{visibility:hidden}
.sub3{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:0 8px 7px 14px;font-size:12px;color:var(--sub)}
.sub3 .key{padding:3px 9px;font-size:11px}
.risk{display:none;margin:-2px 8px 4px;font-size:11px;color:var(--acc)}
.sr:has(.hvb:hover)+.risk,.orow:has(.hold:hover)+.risk,.sub3:has(.hold:hover)+.risk,.sr:has(.hold.down)+.risk{display:block}
.hvs{position:absolute;right:6px;top:0;bottom:0;margin:auto 0;height:max-content;display:flex;gap:6px;visibility:hidden}
.hvs .key{padding:4px 10px;font-size:11.5px}
.sr:hover .hvs{visibility:visible}
.sr:hover:has(.hvs) .v{visibility:hidden}
.sr:hover:has(.hvs) .nm{min-width:0;margin-right:var(--kw,168px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap} /* 鼠标放上去：名字给右边的键让位，放不下用省略号 */
.sr:hover:has(.hvs) .syl{display:none}
.sr:has(.hvs .hold:hover)+.risk,.sr:has(.hvs .hold.down)+.risk{display:block}
.sub3{position:relative}
.sub3{grid-template-columns:minmax(0,1fr) auto}
.sub3 .hvs{bottom:7px}
.sub3:hover .hvs{visibility:visible}
.sub3:hover>.w{visibility:hidden}
.sy{margin-left:6px;color:var(--dim);font-size:12px;font-weight:400;cursor:help}
.syl{margin-left:3px!important;font-size:11px}
.row.back{display:flex;justify-content:space-between;align-items:center}
.row.back [data-v]{cursor:pointer}
.ttl{margin-left:6px;font-style:normal;color:var(--dim)}
.sub3>span:first-child,.oi .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oi{margin:0 0 2px 10px}
.oi .nm small.sb{display:block;margin:1px 0 0;font-size:11px;color:var(--sub)}
.orow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 8px;margin:2px 0 4px;border-radius:9px;background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc);font-size:13px}
.orow .key{padding:4px 10px;font-size:11.5px;visibility:hidden}
.orow:hover .key{visibility:visible}
.more2,.back{padding:8px;font-size:12px;color:var(--sub);cursor:pointer;border-radius:9px}
.back{color:var(--ink)}
.more2:hover,.back:hover{background:var(--hov)}
.hl{animation:hl 1.4s}
@keyframes hl{0%,60%{background:color-mix(in srgb,var(--acc) 18%,transparent)}}
.kids{margin:2px 0 6px}
.crow{border-radius:10px;margin:3px 0;background:var(--off)}
.crow .cln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 9px;cursor:pointer;font-size:12.5px}
.crow .cln .v{font-size:12px}
.crow .cmore{display:none;padding:0 9px 9px}
.crow.open .cmore{display:block}
.crow .cd{margin:0 0 6px;font-size:11.5px;color:var(--sub)}
.crow .acts .key{padding:5px 10px;font-size:11.5px}
.sub2{font-size:11.5px;color:var(--sub);padding:8px 2px 2px}
.it.fold{cursor:pointer;color:var(--sub);border-left-style:dashed}
.it.fold .ar{color:var(--dim);transition:transform .2s}
.it.fold.on .ar{transform:rotate(90deg)}
.sec{display:flex;align-items:center;gap:6px;padding:10px 8px 6px;font-size:11.5px;color:var(--sub);cursor:pointer;user-select:none}
.sec:hover{color:var(--ink)}
.sec .ar{width:12px;font-size:13px;color:var(--sub)}
.sec .st{margin-left:auto;color:var(--dim)}
.its{margin:-2px 0 10px}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:5px 0 5px 10px;border-left:2px solid var(--off);font-size:12.5px;color:var(--ink)}
.it small{display:block;color:var(--sub);font-size:11px}
.it.own{color:var(--sub)}
.it .key{padding:4px 9px;font-size:11px}
.it .w{color:var(--sub);font-size:11.5px}
/* 桌面版：窗口透明，只剩机器本身；影子收小，免得被窗口边切掉 */
body.app{background:transparent}
/* 收着的时候面板里的动画全停（省电脑）；滚动字幕只在面板打开时滚 */
#dev:not(.open) #panel *{animation-play-state:paused!important}
body.app #dev{top:10px;box-shadow:inset 0 1px 0 var(--khi),inset 0 -1px 0 rgba(0,0,0,.4),0 10px 22px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.12)}
</style>

 // 放在屏幕下方、往下展开放不下时：先往上挪到放得下，收起后再挪回原处（还是往下展开）
 let homeY=null,moving=false;const NEED=740;

 HOST.shrink=async()=>{setH(MINH);if(homeY!==null){moving=true;await win.setPosition(new D.LogicalPosition(Math.round(wp.x),Math.round(homeY))).catch(()=>{});homeY=null;setTimeout(()=>{moving=false;where()},500)}};
 try{const sp=JSON.parse(load('pos')||'null');if(sp&&sp.x>-300&&sp.y>-40)win.setPosition(new D.LogicalPosition(sp.x,sp.y)).catch(()=>{})}catch(e){}
 let sf=1,wp={x:0,y:0};const where=async()=>{try{sf=await win.scaleFactor();wp=(await win.outerPosition()).toLogical(sf)}catch(e){}};where();
 let mt=0;win.onMoved(()=>{dragLock=dragLock&&Date.now();if(moving)return;clearTimeout(mt);mt=setTimeout(async()=>{await where();save('pos',JSON.stringify({x:Math.round(wp.x),y:Math.round(wp.y)}))},300)});
 // 按住机身拖：移动超过 4px 才算拖，不然算点

 document.addEventListener('pointerdown',e=>{if(e.button===0&&zone(e.target))dd={x:e.screenX,y:e.screenY}},true);
 let dragLock=0;document.addEventListener('pointermove',e=>{if(dd&&Math.hypot(e.screenX-dd.x,e.screenY-dd.y)>4){dd=null;dragged=true;dragLock=Date.now();setTimeout(()=>{dragged=false},400);win.startDragging().catch(()=>{})}},true);
 document.addEventListener('pointerup',()=>{dd=null},true);
 // 透明的地方让鼠标点穿到下面的窗口
 let lastHit='';HOST.hit=()=>{const r=dev.getBoundingClientRect(),k=[r.left,r.top,r.width,r.height].map(Math.round).join();if(k!==lastHit){lastHit=k;TAURI.core.invoke('set_hit',{x:r.left,y:r.top,w:r.width,h:r.height}).catch(()=>{})}};

  if(g.stopped){guardMsg=L('guardStop')(g.stopped,g.conv,sz(g.freed),g.agent);clearTimeout(gT);gT=setTimeout(()=>{gT=0;guardMsg='';texts();kick()},20000)}
  else if(g.level>0)guardMsg=L('guardWarn')(g.avail.toFixed(1),g.eta?Math.round(g.eta):0,g.who)+(g.level===2&&g.who&&!g.ai?' · '+L('guardMine'):'');
  else if(!gT)guardMsg='';
  texts();kick()});
 TAURI.event.listen('toggle-panel',()=>{state==='mini'||state==='closing'?setLevel(1):doClose()});
 window.addEventListener('blur',()=>{if(Date.now()-dragLock<1500)return;if(state!=='mini'&&state!=='closing')doClose()}); // 刚拖过不算点别处
